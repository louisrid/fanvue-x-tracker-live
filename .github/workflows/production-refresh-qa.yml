name: Production durable refresh QA
on:
  push:
    branches: [main]
    paths:
      - 'netlify/lib/durable-refresh.mjs'
      - 'netlify/functions/tracker-refresh*.mjs'
      - 'tests/production-refresh-persistence.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-durable-refresh
  cancel-in-progress: false
jobs:
  live-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Verify actual background refresh without an open tab
        run: node tests/production-refresh-persistence.mjs
