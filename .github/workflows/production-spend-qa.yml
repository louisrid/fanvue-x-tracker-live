name: Production spend smoke (live refresh)
on:
  push:
    branches: [main]
    paths: ['tests/production-spend-smoke.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-spend-smoke
  cancel-in-progress: false
jobs:
  live-spend:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Verify actual spend and Refresh All
        run: node tests/production-spend-smoke.mjs
